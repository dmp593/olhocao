[project]
name = "olhocao"
version = "4.0.1"
description = "OlhóCão Centro Canino | Website"
authors = [
    {name = "Daniel Pinto",email = "dmp593@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (>=6.1.3,<6.2)",
    "django-modeltranslation (>=0.20.6,<0.21.0)",
    "django-environ (>=0.14.0,<0.15.0)",
    "whitenoise (>=6.9.0,<7.0.0)",
    "mysqlclient (>=2.3.2,<3.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "cachetools (>=7.3.4,<8.0.0)",
    "django-toconline (>=2.0.1,<3.0.0)",
]

[dependency-groups]
dev = [
    "django-browser-reload (>=1.21.0,<2.0.0)",
    "ruff (>=0.17.6,<1.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
