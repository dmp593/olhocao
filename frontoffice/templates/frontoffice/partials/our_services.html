{% load i18n %}
<section id="our-services" class="relative overflow-hidden bg-primary-50 py-16">
  <div class="pointer-events-none absolute inset-0 bg-paws bg-[length:128px_128px] bg-repeat opacity-[0.06]"></div>
  <div class="ui-container relative">
    <div class="mx-auto max-w-3xl text-center">
      <p class="ui-kicker">{{ site_settings.home_services_eyebrow }}</p>
      <h2 class="mt-2 font-serif text-4xl font-bold text-primary-950 md:text-5xl">{{ site_settings.home_services_title }}</h2>
      <p class="mt-4 text-lg leading-8 text-slate-600">{{ site_settings.home_services_subtitle }}</p>
    </div>
    <div class="mx-auto mt-12 grid max-w-6xl gap-6 md:grid-cols-2 xl:grid-cols-4">
      {% for service in service_highlights %}
        {% include "ui/service_card.html" with service=service only %}
      {% endfor %}
    </div>
  </div>
</section>
