<div class="ui-empty">
  {% if icon_template %}<div class="mx-auto mb-3 w-10 text-accent-600">{% include icon_template %}</div>{% endif %}
  <h2 class="text-lg font-bold text-primary-900">{{ title }}</h2>
  {% if description %}<p class="mx-auto mt-2 max-w-xl text-primary-600">{{ description }}</p>{% endif %}
  {% if action_url and action_label %}<a href="{{ action_url }}" class="ui-btn ui-btn-primary mt-5">{{ action_label }}</a>{% endif %}
</div>
