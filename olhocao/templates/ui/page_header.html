<header class="mb-6 flex flex-col gap-4 sm:mb-8 sm:flex-row sm:items-end sm:justify-between">
  <div>
    {% firstof kicker eyebrow as header_kicker %}
    {% if header_kicker %}<p class="ui-kicker">{{ header_kicker }}</p>{% endif %}
    <h1 class="ui-title">{{ title }}</h1>
    {% if subtitle %}<p class="ui-subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="ui-btn ui-btn-primary">{{ action_label }}</a>
  {% endif %}
</header>
