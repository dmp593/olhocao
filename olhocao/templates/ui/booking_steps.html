{% load i18n %}
<ol class="mb-8 grid grid-cols-3" aria-label="{% trans 'Booking progress' %}">
  <li class="border-b-2 pb-2 text-center {% if current_step == 1 %}border-accent-600 text-accent-800{% else %}border-primary-200 text-primary-500{% endif %}"{% if current_step == 1 %} aria-current="step"{% endif %}>
    <span class="mx-auto mb-2 flex size-8 items-center justify-center rounded-full {% if current_step == 1 %}bg-accent-600 text-white{% else %}bg-primary-200 text-primary-700{% endif %}">1</span>
    <span class="text-xs font-bold sm:text-base">{% trans "Select Stay" %}</span>
  </li>
  <li class="border-b-2 pb-2 text-center {% if current_step == 2 %}border-accent-600 text-accent-800{% else %}border-primary-200 text-primary-500{% endif %}"{% if current_step == 2 %} aria-current="step"{% endif %}>
    <span class="mx-auto mb-2 flex size-8 items-center justify-center rounded-full {% if current_step == 2 %}bg-accent-600 text-white{% else %}bg-primary-200 text-primary-700{% endif %}">2</span>
    <span class="text-xs font-bold sm:text-base">{% trans "Add Services" %}</span>
  </li>
  <li class="border-b-2 pb-2 text-center {% if current_step == 3 %}border-accent-600 text-accent-800{% else %}border-primary-200 text-primary-500{% endif %}"{% if current_step == 3 %} aria-current="step"{% endif %}>
    <span class="mx-auto mb-2 flex size-8 items-center justify-center rounded-full {% if current_step == 3 %}bg-accent-600 text-white{% else %}bg-primary-200 text-primary-700{% endif %}">3</span>
    <span class="text-xs font-bold sm:text-base">{% trans "Review & Pay" %}</span>
  </li>
</ol>
