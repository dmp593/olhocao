<dialog id="{{ dialog_id }}" class="m-auto w-[min(32rem,calc(100%-2rem))] rounded-2xl border border-primary-200 bg-white p-0 shadow-2xl backdrop:bg-primary-950/50">
  <div class="p-6">
    <h2 class="text-xl font-bold text-primary-950">{{ title }}</h2>
    <p class="mt-2 text-primary-600">{{ description }}</p>
    <div class="mt-6 flex justify-end gap-3">
      <button type="button" class="ui-btn ui-btn-secondary" data-dialog-close>{{ cancel_label }}</button>
      <form method="post" action="{{ action_url }}">
        {% csrf_token %}
        <button type="submit" class="ui-btn ui-btn-danger">{{ confirm_label }}</button>
      </form>
    </div>
  </div>
</dialog>
