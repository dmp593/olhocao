{% load i18n %}
<section
  class="mt-6"
  data-stay-media
  data-can-edit="{% if can_edit %}true{% else %}false{% endif %}"
  data-close-label="{% trans 'Close media viewer' %}"
  data-delete-label="{% trans 'Delete media' %}"
  data-delete-confirmation="{% trans 'Remove this item?' %}"
  data-action-error="{% trans 'The operation could not be completed. Please try again.' %}"
  {% if can_edit %}data-upload-url="{% url 'hotel:stay_media_upload' stay.id %}"{% endif %}>
  <h3 class="mb-3 text-lg font-semibold text-primary-800 sm:text-xl">{% trans "Photo & Video Gallery" %}</h3>

  {% if can_edit %}
    <div class="ui-media-drop-zone" data-media-drop-zone>
      <label class="block cursor-pointer text-center">
        <input type="file" multiple accept="image/*,video/*" class="sr-only" data-media-input>
        <span class="text-sm text-primary-600 sm:text-base">
          <span class="font-bold text-accent-700">{% trans "Drop files to upload" %}</span>
          <span class="mx-1">·</span>
          {% trans "or" %} <span class="underline">{% trans "browse" %}</span>
        </span>
        <span class="mt-1 block text-xs text-primary-500">{% trans "Images and videos supported. Large files upload in chunks." %}</span>
      </label>
      <div class="mt-3 space-y-2" data-media-progress aria-live="polite"></div>
    </div>
  {% endif %}

  <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4" data-media-gallery>
    {% for media in stay.media.all %}
      <figure class="relative overflow-hidden rounded-lg bg-white shadow-sm ring-1 ring-primary-200">
        {% if media.content_type|default:''|slice:':5' == 'video' %}
          <video src="{% url 'hotel:stay_media_download' stay.id media.id %}" class="h-32 w-full cursor-zoom-in object-cover" preload="metadata" muted></video>
        {% else %}
          <img src="{% url 'hotel:stay_media_download' stay.id media.id %}" class="h-32 w-full cursor-zoom-in object-cover" loading="lazy" alt="{{ media.original_filename }}">
        {% endif %}
        <figcaption class="truncate px-2 py-1 text-xs text-primary-600">{{ media.original_filename }}</figcaption>
        {% if can_edit %}
          <button type="button" data-delete-url="{% url 'hotel:stay_media_delete' stay.id media.id %}" aria-label="{% trans 'Delete media' %}" class="absolute right-1 top-1 rounded-full bg-red-700 px-2 py-1 text-xs text-white transition hover:bg-red-800">✕</button>
        {% endif %}
      </figure>
    {% empty %}
      <p class="col-span-full text-sm text-primary-500" data-media-empty>{% trans "No media yet." %}</p>
    {% endfor %}
  </div>
</section>
